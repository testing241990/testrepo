name: Node.js Continuous Integration

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    # Use the latest Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest

    # Matrix testing lets you test multiple Node versions simultaneously
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      # Step 1: Clone the repository into the runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up the specific Node.js environment
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Automatically caches dependencies for faster subsequent builds

      # Step 3: Clean install project dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run build script (if applicable)
      - name: Build Application
        run: npm run build --if-present

      # Step 5: Execute your automated test suite
      - name: Run Tests
        run: npm test
